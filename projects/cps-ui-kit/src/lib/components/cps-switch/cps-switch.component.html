<div class="cps-switch-container" [style.--cps-switch-animated]="ready ? 1 : 0">
  <label class="cps-switch" data-testid="cps-switch">
    <input
      #switchInput
      type="checkbox"
      role="switch"
      data-testid="cps-switch-input"
      [disabled]="disabled"
      [checked]="value"
      (change)="updateValueEvent($event)"
      [attr.aria-label]="ariaLabel || label || null" />
    <span class="cps-switch-slider" aria-hidden="true"></span>
  </label>
  @if (label) {
    <span
      class="cps-switch-label"
      data-testid="cps-switch-label"
      [class.cps-switch-label-disabled]="disabled"
      aria-hidden="true"
      (click)="onLabelClick()"
      >{{ label }}</span
    >
  }
  @if (infoTooltip) {
    <cps-info-circle
      class="cps-switch-info-circle"
      data-testid="cps-switch-info-circle"
      size="xsmall"
      [tooltipPosition]="infoTooltipPosition"
      [tooltipContentClass]="infoTooltipClass"
      [tooltipMaxWidth]="infoTooltipMaxWidth"
      [tooltipPersistent]="infoTooltipPersistent"
      [tooltipText]="infoTooltip">
    </cps-info-circle>
  }
</div>
