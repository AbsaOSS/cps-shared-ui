<cps-radio-button
  [option]="option"
  [groupName]="radioGroup?.groupName || ''"
  [groupDisabled]="groupDisabled"
  [checked]="radioGroup?.value == option.value"
  (blurred)="onBlur()"
  (focused)="onFocus()"
  (updateValueEvent)="updateValueEvent($event)">
  <ng-content></ng-content>
</cps-radio-button>
