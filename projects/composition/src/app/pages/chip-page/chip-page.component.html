<app-component-docs-viewer [componentData]="componentData">
  <app-code-example label="Basic" [htmlCode]="examples.basic.html">
    <div class="chips-group-row">
      <cps-chip label="Basic chip"></cps-chip>
      <cps-chip label="Disabled chip" [disabled]="true"></cps-chip>
    </div>
  </app-code-example>

  <app-code-example label="With icon" [htmlCode]="examples.withIcon.html">
    <div class="chips-group-row">
      <cps-chip
        data-testid="icon-before-chip"
        label="Left icon chip"
        icon="checked"></cps-chip>
      <cps-chip
        data-testid="icon-after-chip"
        label="Right icon chip"
        icon="checked"
        iconPosition="after"></cps-chip>
      <cps-chip
        label="Chip with colored icon"
        icon="avatar"
        iconColor="success"></cps-chip>
      <cps-chip label="Disabled chip" icon="eye" [disabled]="true"></cps-chip>
    </div>
  </app-code-example>

  <app-code-example
    label="Closable"
    [htmlCode]="examples.closable.html"
    [tsCode]="examples.closable.ts">
    <div class="chips-group-row">
      @if (!chipClosed) {
        <cps-chip
          #closableChipRef
          data-testid="closable-chip"
          label="Closable chip"
          [closable]="true"
          (closed)="onToggleChip()"></cps-chip>
      }
      @if (chipClosed) {
        <cps-button
          #resetChipBtnRef
          data-testid="reset-chip-button"
          label="Reset chip"
          (clicked)="onToggleChip()"
          size="xsmall"></cps-button>
      }
      <cps-chip
        data-testid="closable-chip-with-custom-close-label"
        label="Closable chip with custom close label"
        [closable]="true"
        closeButtonAriaLabel="Dismiss"
        (closed)="onDismissChip()">
      </cps-chip>
      <cps-chip
        data-testid="disabled-closable-chip"
        label="Disabled closable chip"
        [disabled]="true"
        [closable]="true"></cps-chip>
    </div>
  </app-code-example>
</app-component-docs-viewer>
