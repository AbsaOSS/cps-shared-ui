<app-component-docs-viewer [componentData]="componentData">
  <!-- Example of component's usage -->
  <app-code-example
    label="Required textarea with a tooltip"
    [htmlCode]="examples.requiredTextarea.html"
    [tsCode]="examples.requiredTextarea.ts">
    <form [formGroup]="form">
      <cps-textarea
        data-testid="required-textarea"
        label="Required textarea with a tooltip"
        placeholder="Please enter any text"
        hint="Maximum 3 characters are allowed"
        infoTooltip="Provide any information here"
        [clearable]="true"
        formControlName="requiredTextarea">
      </cps-textarea>
    </form>
  </app-code-example>

  <app-code-example
    label="Disabled textarea"
    [htmlCode]="examples.disabledTextarea.html">
    <cps-textarea
      data-testid="disabled-textarea"
      label="Disabled textarea"
      [disabled]="true"></cps-textarea>
  </app-code-example>

  <app-code-example
    label="Readonly textarea"
    [htmlCode]="examples.readonlyTextarea.html">
    <cps-textarea
      data-testid="readonly-textarea"
      label="Readonly textarea"
      hint="This textarea is readonly"
      value="Value to show"
      [readonly]="true">
    </cps-textarea>
  </app-code-example>

  <app-code-example
    label="Clearable textarea with persistent clear icon"
    [htmlCode]="examples.clearableTextarea.html">
    <cps-textarea
      data-testid="clearable-textarea"
      label="Clearable textarea with persistent clear icon"
      hint="This textarea is clearable"
      value="Clear me"
      [clearable]="true"
      [persistentClear]="true">
    </cps-textarea>
  </app-code-example>

  <app-code-example
    label="Resizable textarea with a max height"
    [htmlCode]="examples.maxHeightTextarea.html">
    <cps-textarea
      data-testid="max-height-textarea"
      label="Resizable textarea with a max height"
      hint="Use the resize handle or Arrow keys to resize, up to a cap of 8rem"
      [rows]="2"
      [maxHeight]="'8rem'">
    </cps-textarea>
  </app-code-example>

  <app-code-example
    label="Textarea with hidden hint/error details"
    [htmlCode]="examples.hideDetailsTextarea.html">
    <cps-textarea
      data-testid="hide-details-textarea"
      label="Textarea with hidden hint/error details"
      hint="You should not see this hint"
      [hideDetails]="true"></cps-textarea>
  </app-code-example>

  <app-code-example
    label="Unlabeled textarea with an accessible name"
    [htmlCode]="examples.ariaLabelTextarea.html">
    <cps-textarea
      data-testid="aria-label-textarea"
      ariaLabel="Additional comments"
      placeholder="Type your comments here"></cps-textarea>
  </app-code-example>

  <app-code-example
    label="Two-way binding"
    [htmlCode]="examples.twoWayBindingTextarea.html"
    [tsCode]="examples.twoWayBindingTextarea.ts">
    <div class="sync-val-example">
      <cps-textarea
        data-testid="two-way-binding-textarea"
        width="25rem"
        label="Textarea with two-way binding, type something in"
        [(ngModel)]="syncVal"
        resizable="none"
        hint="This textarea has a fixed width of 25rem and is not resizable"
        [ngModelOptions]="{ standalone: true }">
      </cps-textarea>
      <span class="sync-val" data-testid="two-way-binding-textarea-value">{{
        syncVal
      }}</span>
    </div>
  </app-code-example>
</app-component-docs-viewer>
