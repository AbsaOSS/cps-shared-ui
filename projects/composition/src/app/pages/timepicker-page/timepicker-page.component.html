<app-component-docs-viewer [componentData]="componentData">
  <!-- Example of component's usage -->
  <app-code-example
    label="Required 12-hour timepicker with a tooltip"
    [htmlCode]="examples.requiredTimepicker.html"
    [tsCode]="examples.requiredTimepicker.ts">
    <form [formGroup]="form">
      <cps-timepicker
        data-testid="required-timepicker"
        label="Required 12-hour timepicker with a tooltip"
        formControlName="requiredTimepicker"
        infoTooltip="Provide any information here"></cps-timepicker>
    </form>
  </app-code-example>

  <app-code-example
    label="Disabled 12-hour timepicker"
    [htmlCode]="examples.disabledTimepicker.html">
    <cps-timepicker
      data-testid="disabled-timepicker"
      label="Disabled 12-hour timepicker"
      [disabled]="true"
      hint="This timepicker is disabled">
    </cps-timepicker>
  </app-code-example>

  <app-code-example
    label="12-hour timepicker with seconds"
    [htmlCode]="examples.secondsTimepicker.html"
    [tsCode]="examples.secondsTimepicker.ts">
    <cps-timepicker
      data-testid="seconds-timepicker"
      label="12-hour timepicker with seconds"
      (valueChanged)="onValueChanged($event)"
      [withSeconds]="true">
    </cps-timepicker>
  </app-code-example>

  <app-code-example
    label="24-hour timepicker"
    [htmlCode]="examples.use24HourTimepicker.html">
    <cps-timepicker
      data-testid="use-24-hour-timepicker"
      label="24-hour timepicker"
      [use24HourTime]="true">
    </cps-timepicker>
  </app-code-example>

  <app-code-example
    label="24-hour timepicker with seconds"
    [htmlCode]="examples.use24HourSecondsTimepicker.html"
    [tsCode]="examples.use24HourSecondsTimepicker.ts">
    <cps-timepicker
      data-testid="use-24-hour-seconds-timepicker"
      label="24-hour timepicker with seconds"
      [use24HourTime]="true"
      [value]="val24"
      [withSeconds]="true">
    </cps-timepicker>
  </app-code-example>

  <app-code-example
    label="Unlabeled timepicker with an accessible name"
    [htmlCode]="examples.ariaLabelTimepicker.html">
    <cps-timepicker
      data-testid="aria-label-timepicker"
      ariaLabel="Choose a time">
    </cps-timepicker>
  </app-code-example>

  <app-code-example
    label="Timepicker with hidden hint/error details"
    [htmlCode]="examples.hideDetailsTimepicker.html">
    <cps-timepicker
      data-testid="hide-details-timepicker"
      label="Timepicker with hidden hint/error details"
      hint="You should not see this hint"
      [hideDetails]="true">
    </cps-timepicker>
  </app-code-example>

  <app-code-example
    label="Timepicker with a mandatory value"
    [htmlCode]="examples.mandatoryValueTimepicker.html"
    [tsCode]="examples.mandatoryValueTimepicker.ts">
    <cps-timepicker
      data-testid="mandatory-value-timepicker"
      label="Timepicker with a mandatory value"
      hint="Fields snap back to their first option instead of clearing"
      [mandatoryValue]="true"
      [value]="mandatoryVal">
    </cps-timepicker>
  </app-code-example>

  <app-code-example
    label="Two-way binding"
    [htmlCode]="examples.twoWayBindingTimepicker.html"
    [tsCode]="examples.twoWayBindingTimepicker.ts">
    <div class="sync-val-example">
      <cps-timepicker
        data-testid="two-way-binding-timepicker"
        label="12-hour timepicker with two-way binding"
        [(ngModel)]="syncVal"
        [withSeconds]="true"
        [ngModelOptions]="{ standalone: true }">
      </cps-timepicker>
      <span data-testid="two-way-binding-timepicker-value">{{
        syncVal | json
      }}</span>
    </div>
  </app-code-example>
</app-component-docs-viewer>
